<title>Varai Cafe — Book a table</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--ink:#1B1613;--paper:#FBFAF7;--blue:#1D3FD8;--blue2:#1631AE;--sun:#FFB81C;--line:#E4E0D6;--mute:#686258;--ok:#1F8A4C;--bad:#C2321F;
--disp:'Young Serif','Tiro Devanagari Hindi',Georgia,serif;--body:'Figtree','Hind',system-ui,-apple-system,'Segoe UI',sans-serif}
*,*::before,*::after{box-sizing:border-box}*{margin:0}
[hidden]{display:none!important}
html{overflow-x:hidden;scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.card :focus-visible,.menu-sec :focus-visible,#admin :focus-visible{outline-color:var(--blue)}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:-.015em;line-height:1.05}
html[lang=hi] h1,html[lang=hi] h2,html[lang=hi] h3{letter-spacing:0;line-height:1.3}
h2{font-size:clamp(34px,4.6vw,56px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:12px;border:2px solid var(--blue);background:var(--blue);color:#fff;font-weight:700;text-decoration:none;transition:background .15s,transform .1s}
.btn:hover{background:var(--blue2);border-color:var(--blue2)}.btn:active{transform:translateY(1px)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--ink)}.btn.sun:hover{background:#f0a800;border-color:#f0a800}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px;border-radius:10px}
/* header */
header{position:sticky;top:0;z-index:30;background:var(--blue);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:23px;text-decoration:none}
nav{display:flex;gap:28px;font-weight:600;font-size:15px}nav a{text-decoration:none;opacity:.8}nav a:hover{opacity:1}
.right{display:flex;gap:10px;align-items:center}
.lang{display:flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px}
.lang button{border:0;background:none;border-radius:8px;min-width:42px;height:34px;font-weight:700;font-size:14px;color:#fff}
.lang button.on{background:#fff;color:var(--blue)}
/* hero: the checked tablecloth */
.hero{background-color:var(--blue);background-image:conic-gradient(rgba(255,255,255,.08) 25%,transparent 0 50%,rgba(255,255,255,.08) 0 75%,transparent 0);background-size:72px 72px;color:#fff;padding:56px 0 72px}
.hgrid>*,.vgrid>*{min-width:0}
.hgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:center}
.open{display:inline-flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);font-weight:600;font-size:14px;padding:7px 14px;border-radius:99px}
.open i{width:9px;height:9px;border-radius:50%;background:var(--ok)}.open.shut i{background:var(--bad)}
h1{font-size:clamp(46px,6.6vw,92px);line-height:.98;margin:22px 0}
html[lang=hi] h1{font-size:clamp(38px,5.2vw,68px);line-height:1.2}
.hero p.lead{font-size:19px;max-width:42ch;color:#dce3ff}
.perks{list-style:none;padding:0;margin-top:28px;display:grid;gap:10px;font-weight:600}
.perks li{display:flex;gap:12px;align-items:center}
.perks svg{flex:none;background:var(--sun);border-radius:50%;padding:4px}
/* booking card */
.card{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:clamp(20px,3vw,32px);min-height:470px;display:flex;flex-direction:column}
.prog{display:flex;gap:6px;margin-bottom:18px}.prog i{flex:1;height:5px;border-radius:5px;background:var(--line)}.prog i.on{background:var(--blue)}
.step{font-size:14px;font-weight:600;color:var(--mute)}
.card h3{font-size:30px;margin:4px 0 6px}
.lbl{display:block;font-weight:700;font-size:15px;margin:22px 0 10px}
.stp{display:flex;align-items:center;gap:18px}
.stp button{width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:28px;line-height:1;font-weight:600}
.stp button:hover{background:var(--ink);color:#fff}.stp button[disabled]{opacity:.3;pointer-events:none}
.stp b{font-family:var(--disp);font-weight:400;font-size:52px;min-width:56px;text-align:center;line-height:1}
.stp span{color:var(--mute);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:4px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;min-height:48px;min-width:64px;font-weight:700;font-size:15px;text-align:center;line-height:1.2;flex:none}
.chip small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}.chip.on small,.chip.on em{color:#d6defc}
.chip[disabled]{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.chip em{display:block;font-style:normal;font-size:11px;color:var(--bad);font-weight:700}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.times .chip{min-width:0;padding:9px 4px}
.sum{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--sun);border-radius:10px;padding:12px 14px;font-weight:600;margin:8px 0 0}
input{width:100%;padding:14px;border:1.5px solid var(--ink);border-radius:10px;background:#fff;min-height:52px}
input:focus{outline:3px solid var(--sun);outline-offset:0}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:20px;font-weight:600}.hint{color:var(--mute);font-size:14px;margin-top:10px}
.nav2{margin-top:auto;padding-top:22px;display:flex;justify-content:space-between;gap:10px}.nav2 .btn:last-child{flex:1}
/* confirmation ticket */
.done{text-align:center;margin:auto 0}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok);margin:0 auto 14px;display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.ticket{margin:18px 0;border:2px dashed var(--ink);border-radius:14px;padding:16px;background:#fff}
.code{font-family:var(--disp);font-size:42px;letter-spacing:.06em;color:var(--blue);line-height:1.1}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
/* menu */
.menu-sec{padding:88px 0}
.mhead{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.mhead p{color:var(--mute);max-width:40ch}
.tabs{display:flex;gap:6px;margin:30px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs button{border:2px solid var(--ink);border-bottom:0;background:transparent;border-radius:12px 12px 0 0;padding:12px 22px;font-weight:700;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--paper)}
.menu{border:2px solid var(--ink);border-radius:0 14px 14px 14px;padding:12px clamp(18px,4vw,44px);background:#fff;display:grid;grid-template-columns:1fr 1fr;column-gap:56px}
.item{display:flex;align-items:baseline;gap:10px;padding:18px 0}
.item b{font-weight:600;font-size:18px;display:flex;align-items:center;gap:10px}
.item hr{flex:1;border:0;border-bottom:2px dotted #bdb7aa;transform:translateY(-4px);min-width:16px}
.item .p{font-family:var(--disp);font-size:19px}
.v{width:15px;height:15px;border:1.5px solid var(--ok);border-radius:3px;display:inline-grid;place-items:center;flex:none}
.v::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}.v.nv{border-color:var(--bad)}.v.nv::after{background:var(--bad)}
/* visit */
.visit{background:var(--ink);color:var(--paper);padding:88px 0 0}
.vgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:64px;margin-top:36px}
.addr{font-family:var(--disp);font-size:clamp(26px,3.4vw,40px);line-height:1.2}
.hrs{display:grid;gap:0}.hrs div{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.18);font-size:18px}
footer{margin-top:72px;border-top:1px solid rgba(255,255,255,.18);padding:24px 0 32px;font-size:14px;color:#b9b3a8}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}footer a{margin-left:14px}
/* admin */
#admin{display:none;padding:40px 0 80px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}
.stat{border:2px solid var(--ink);border-radius:14px;padding:18px;background:#fff}.stat b{font-family:var(--disp);font-weight:400;font-size:44px;display:block;line-height:1.1}.stat span{color:var(--mute);font-size:14px;font-weight:600}
.tw{overflow-x:auto;border:2px solid var(--ink);border-radius:14px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mute)}tr:last-child td{border:0}
.pill{padding:4px 11px;border-radius:99px;font-size:13px;font-weight:700}
.pill.confirmed{background:#dbeee3;color:var(--ok)}.pill.cancelled{background:#f8dcd7;color:var(--bad)}.pill.arrived{background:#dfe5ff;color:var(--blue)}
.pin{max-width:340px;margin:80px auto;text-align:center}.pin input{text-align:center;letter-spacing:.5em;font-size:24px;margin:16px 0}
@media(max-width:900px){nav{display:none}.hgrid,.vgrid{grid-template-columns:minmax(0,1fr);gap:40px}.hero{padding:36px 0 56px}.menu{grid-template-columns:minmax(0,1fr)}.menu-sec,.visit{padding-top:60px}.card{box-shadow:5px 5px 0 var(--ink)}}
@media(max-width:480px){.wrap{padding:0 16px}.btn.book-top{display:none}.stats{grid-template-columns:1fr 1fr}.times{grid-template-columns:repeat(3,1fr)}h3{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

["bites","Masala Omelette Pav","मसाला ऑमलेट पाव",170,0],["bites","Paneer Tikka Sandwich","पनीर टिक्का सैंडविच",230,1],["bites","Chicken Club Sandwich","चिकन क्लब सैंडविच",270,0],["bites","Veg Maggi","वेज मैगी",130,1],["bites","Peri Peri Fries","पेरी पेरी फ्राइज़",180,1],["bites","Cheese Garlic Bread","चीज़ गार्लिक ब्रेड",190,1],
["sweet","Brownie with Ice Cream","आइसक्रीम के साथ ब्राउनी",240,1],["sweet","Blueberry Cheesecake","ब्लूबेरी चीज़केक",260,1],["sweet","Gulab Jamun Tart","गुलाब जामुन टार्ट",190,1],["sweet","Tiramisu Cup","तिरामिसु कप",250,1]];
let L=(()=>{try{return localStorage.getItem("vc_lang")||"en"}catch(e){return"en"}})(),cat="coffee";
const SLOTS=[];for(let h=12;h<=21;h++){SLOTS.push(h+":00",h+":30")}SLOTS.push("22:00");
const CAP=6,K="vc_bookings";
const pad=n=>String(n).padStart(2,"0"),fmtT=s=>{const[h,m]=s.split(":").map(Number);return(h%12||12)+":"+pad(m)+" "+(h<12?"am":"pm")};
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return d};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const loc=()=>L==="hi"?"hi-IN":"en-IN";
const dLabel=s=>new Date(s+"T00:00").toLocaleDateString(loc(),{weekday:"short",day:"numeric",month:"short"});
function load(){try{const v=JSON.parse(localStorage.getItem(K));if(v)return v}catch(e){}
  const t=iso(addD(0)),n=iso(addD(1)),s=[];
  [["12:30",5],["13:00",6],["13:00",6],["20:00",4],["20:00",4],["20:00",2],["20:30",3]].forEach((x,i)=>s.push({id:"S"+i,date:i<5?t:n,time:x[0],guests:x[1],name:["Aarav Shah","Meera Nair","Rohan Iyer","Sana Khan","Dev Patel","Isha Rao","Kabir Mehta"][i],phone:"9800000000",note:"",status:"confirmed",code:"VC-"+(1000+i*37)}));
  save(s);return s}
function save(b){try{localStorage.setItem(K,JSON.stringify(b))}catch(e){}}
const used=(b,d,t)=>b.filter(x=>x.date===d&&x.time===t&&x.status!=="cancelled").length;

function openStatus(){const n=new Date(),wk=n.getDay()>0&&n.getDay()<6,o=wk?9:8,c=wk?23:24,h=n.getHours()+n.getMinutes()/60,t=L;
  const f=x=>x===24?"12 am":(x%12||12)+(x<12?" am":" pm");
  const isOpen=h>=o&&h<c;$("#open").classList.toggle("shut",!isOpen);
  $("#openTxt").textContent=isOpen?T[t].openNow+f(c):T[t].shut+(h<o?f(o):f(9))}
function applyLang(){
  document.documentElement.lang=L;
  $$("[data-i]").forEach(e=>e.textContent=T[L][e.dataset.i]);
  $$(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  openStatus();renderTabs();renderMenu();renderBook();if(location.hash==="#admin")renderAdmin();
}
$$(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("vc_lang",L)}catch(e){}applyLang()});
function renderTabs(){$("#tabs").innerHTML=Object.keys(T[L].cats).map(c=>`<button role="tab" aria-selected="${c===cat}" class="${c===cat?"on":""}" data-c="${c}">${T[L].cats[c]}</button>`).join("");
  $$("#tabs button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderTabs();renderMenu()})}
function renderMenu(){$("#menuList").innerHTML=M.filter(m=>m[0]===cat).map(m=>`<div class="item"><b><i class="v ${m[4]?"":"nv"}" title="${m[4]?"Veg":"Non-veg"}"></i>${L==="hi"?m[2]:m[1]}</b><hr><span class="p">₹${m[3]}</span></div>`).join("")}

/* booking */
const fresh=()=>({step:1,guests:2,date:iso(addD(0)),time:"",name:"",phone:"",note:"",err:"",code:""});
let S=fresh();
function dateChips(){return[0,1,2,3,4,5,6].map(n=>{const d=addD(n),v=iso(d);const top=n===0?T[L].today:n===1?T[L].tmrw:d.toLocaleDateString(loc(),{weekday:"short"});
  return`<button class="chip ${S.date===v?"on":""}" data-d="${v}">${top}<small>${d.toLocaleDateString(loc(),{day:"numeric",month:"short"})}</small></button>`}).join("")}
const head=(t,title)=>`<div class="prog">${[1,2,3].map(i=>`<i class="${i<=S.step?"on":""}"></i>`).join("")}</div><span class="step">${t.step} ${S.step} ${t.of} 3</span><h3>${title}</h3>`;
function renderBook(){
  const t=T[L],b=load(),P=$("#book");let h="";
  if(S.step===1){
    h=`${head(t,t.s1)}<span class="lbl">${t.guests}</span>
    <div class="stp"><button data-gs="-1" aria-label="−" ${S.guests<=1?"disabled":""}>−</button><b>${S.guests}</b><button data-gs="1" aria-label="+" ${S.guests>=8?"disabled":""}>+</button><span>${t.people}</span></div>
    <p class="hint">${t.big}</p>
    <span class="lbl">${t.date}</span><div class="chips scroll">${dateChips()}</div>
    <div class="nav2"><button class="btn" id="go">${t.next}</button></div>`;
  }else if(S.step===2){
    const now=new Date(),isToday=S.date===iso(now);
    h=`${head(t,t.s2)}<div class="sum">${dLabel(S.date)}, ${S.guests} ${t.people}</div><span class="lbl">${t.time}</span><div class="times">${SLOTS.map(s=>{
      const[hh,mm]=s.split(":").map(Number),past=isToday&&(hh*60+mm<=now.getHours()*60+now.getMinutes());
      const left=CAP-used(b,S.date,s),dis=past||left<=0;
      return`<button class="chip ${S.time===s?"on":""}" ${dis?"disabled":""} data-t="${s}">${fmtT(s)}${!dis&&left<=2?`<em>${left}${t.left}</em>`:dis&&!past?`<em>${t.full}</em>`:""}</button>`}).join("")}</div>
    <p class="err">${S.err}</p><div class="nav2"><button class="btn ghost" id="bk">${t.back}</button><button class="btn" id="go">${t.next}</button></div>`;
  }else if(S.step===3){
    h=`${head(t,t.s3)}<div class="sum">${dLabel(S.date)}, ${fmtT(S.time)}, ${S.guests} ${t.people}</div>
    <label class="lbl" for="nm">${t.name}</label><input id="nm" autocomplete="name" value="${esc(S.name)}">
    <label class="lbl" for="ph">${t.phone}</label><input id="ph" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" value="${esc(S.phone)}" placeholder="98XXXXXXXX">
    <label class="lbl" for="nt">${t.note}</label><input id="nt" value="${esc(S.note)}">
    <p class="err">${S.err}</p><div class="nav2"><button class="btn ghost" id="bk">${t.back}</button><button class="btn" id="go">${t.confirm}</button></div>`;
  }else{
    h=`<div class="done"><div class="tick"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h3>${t.done}</h3><p style="margin-top:8px">${esc(S.name)} ${t.on} ${S.guests} ${t.people}<br><b>${dLabel(S.date)}, ${fmtT(S.time)}</b></p>
    <div class="ticket"><div class="code">${S.code}</div><p class="hint" style="margin-top:4px">${t.donep}</p></div>
    <div class="row"><button class="btn sm ghost" id="ics">${t.cal}</button><a class="btn sm ghost" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("Varai Cafe: "+dLabel(S.date)+", "+fmtT(S.time)+", "+S.guests+" "+t.people+". "+S.code)}">${t.wa}</a></div>
    <div class="row"><button class="btn sm" id="again">${t.another}</button></div></div>`;
  }
  P.innerHTML=h;wire();
}
function wire(){
  $$("[data-gs]").forEach(e=>e.onclick=()=>{S.guests=Math.min(8,Math.max(1,S.guests+ +e.dataset.gs));renderBook()});
  $$("[data-d]").forEach(e=>e.onclick=()=>{S.date=e.dataset.d;S.time="";renderBook()});
  $$("[data-t]").forEach(e=>e.onclick=()=>{S.time=e.dataset.t;S.err="";renderBook()});
  const bk=$("#bk"),go=$("#go"),ag=$("#again"),ics=$("#ics");
  if(bk)bk.onclick=()=>{keep();S.err="";S.step--;renderBook()};
  if(ag)ag.onclick=()=>{S=fresh();renderBook()};
  if(ics)ics.onclick=()=>{const[h,m]=S.time.split(":").map(Number),d=S.date.replace(/-/g,""),e=pad(h+1)+pad(m+30>59?0:m+30);
    const end=m+30>59?pad(h+2)+"00":pad(h+1)+pad(m+30);
    const txt=["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT","SUMMARY:Table at Varai Cafe ("+S.code+")","DTSTART:"+d+"T"+pad(h)+pad(m)+"00","DTEND:"+d+"T"+end+"00","LOCATION:Varai Cafe","END:VEVENT","END:VCALENDAR"].join("\r\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));a.download="varai-cafe-booking.ics";a.click()};
  if(go)go.onclick=()=>{keep();const t=T[L];
    if(S.step===1){S.step=2;S.err="";return renderBook()}
    if(S.step===2){if(!S.time){S.err=t.e_time;return renderBook()}S.err="";S.step=3;return renderBook()}
    if(S.name.trim().length<2){S.err=t.e_name;return renderBook()}
    if(!/^[6-9]\d{9}$/.test(S.phone)){S.err=t.e_ph;return renderBook()}
    const b=load();if(CAP-used(b,S.date,S.time)<=0){S.step=2;S.time="";S.err=t.e_gone;return renderBook()}
    S.code="VC-"+Math.floor(1000+Math.random()*9000);
    b.push({id:"B"+Date.now(),date:S.date,time:S.time,guests:S.guests,name:S.name.trim(),phone:S.phone,note:S.note.trim(),status:"confirmed",code:S.code});
    save(b);S.step=4;renderBook()};
}
function keep(){const n=$("#nm"),p=$("#ph"),t=$("#nt");if(n)S.name=n.value;if(p)S.phone=p.value.replace(/\D/g,"");if(t)S.note=t.value}

/* staff view */
let authed=false;
function renderAdmin(){
  const t=T[L],A=$("#adminBody");
  if(!authed){A.innerHTML=`<div class="pin"><h2>${t.a_pin}</h2><p class="hint">${t.a_pin_p} (demo: 1234)</p><input id="pin" type="password" inputmode="numeric" maxlength="4" autofocus><p class="err" id="pe"></p><button class="btn" id="pgo">${t.a_go}</button><p style="margin-top:20px"><a href="#top">${t.exit}</a></p></div>`;
    const f=()=>{if($("#pin").value==="1234"){authed=true;renderAdmin()}else $("#pe").textContent=t.a_bad};$("#pgo").onclick=f;$("#pin").onkeydown=e=>{if(e.key==="Enter")f()};return}
  const b=load().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)),td=iso(new Date());
  const act=b.filter(x=>x.status!=="cancelled"),tod=act.filter(x=>x.date===td);
  A.innerHTML=`<p><a href="#top">${t.exit}</a></p><h2 style="margin-top:12px">${t.a_h}</h2>
  <div class="stats"><div class="stat"><b>${tod.length}</b><span>${t.a_t}</span></div><div class="stat"><b>${act.filter(x=>x.date>td).length}</b><span>${t.a_u}</span></div><div class="stat"><b>${tod.reduce((a,x)=>a+x.guests,0)}</b><span>${t.a_g}</span></div></div>
  <div class="tw"><table><thead><tr><th>${t.a_when}</th><th>${t.a_who}</th><th>${t.a_code}</th><th>${t.a_st}</th><th></th></tr></thead><tbody>${b.length?b.map(x=>`<tr><td><b>${dLabel(x.date)}</b><br>${fmtT(x.time)}</td><td>${esc(x.name)}, ${x.guests}<br><small style="color:var(--mute)">${esc(x.phone)}${x.note?" · "+esc(x.note):""}</small></td><td><b>${x.code}</b></td><td><span class="pill ${x.status}">${t[x.status]}</span></td><td style="white-space:nowrap">${x.status==="confirmed"?`<button class="btn sm" data-a="${x.id}">${t.arrive}</button> `:""}<button class="btn sm ghost" data-x="${x.id}">${x.status==="cancelled"?t.restore:t.cancel}</button></td></tr>`).join(""):`<tr><td colspan="5">${t.a_none}</td></tr>`}</tbody></table></div>
  <p style="margin-top:20px"><button class="btn sm ghost" id="rs">${t.reset}</button></p>`;
  $$("[data-x]").forEach(e=>e.onclick=()=>{const a=load(),i=a.find(y=>y.id===e.dataset.x);i.status=i.status==="cancelled"?"confirmed":"cancelled";save(a);renderAdmin()});
  $$("[data-a]").forEach(e=>e.onclick=()=>{const a=load();a.find(y=>y.id===e.dataset.a).status="arrived";save(a);renderAdmin()});
  $("#rs").onclick=()=>{try{localStorage.removeItem(K)}catch(e){}renderAdmin()};
}
function route(){const a=location.hash==="#admin";$("#site").style.display=a?"none":"";$("#admin").style.display=a?"block":"none";if(a){authed=false;renderAdmin();scrollTo(0,0)}}
addEventListener("hashchange",route);
applyLang();route();
</script>
